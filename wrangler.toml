name = "m"
main = "src/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "ADMINS"
id = "64b15fa4516246ee88938ade841666b8"

[[kv_namespaces]]
binding = "USERS"
id = "2dd6c260cd6543c086663b1ea0ca45f3"

# Lịch sử Durable Object IpRegistry — đã tạo ở v1 (khi còn chống trùng IP),
# giờ xóa hẳn ở v2. Cloudflare bắt buộc phải khai báo tường minh bước xóa
# này, không được lặng lẽ bỏ binding — nếu không sẽ báo lỗi 10064.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IpRegistry"]

[[migrations]]
tag = "v2"
deleted_classes = ["IpRegistry"]

# Cron Trigger — làm mới cache bảng xếp hạng mỗi 15 phút
[triggers]
crons = ["*/15 * * * *"]

[vars]
CHU_SO_HUU = "7055595466"
NHOM_LOG = "@nhomlogbot"
LINK_MINIAPP = "https://m.vuacaytien.workers.dev/"
LINK_ANH = "https://i.ibb.co/7x7DFnZ9/1783599852392.jpg"
# THUONG_COIN_QUANG_CAO (mặc định 5000) và THUONG_COIN_NHIEM_VU (mặc định 25000)
# có thể khai báo ở đây nếu muốn ghi đè mặc định trong code.

# Secrets — set qua Dashboard: Settings > Variables and secrets
#   BOT_TOKEN, LINK4M_API_TOKEN, WEBHOOK_SECRET, ADMIN_WEB_SECRET
#   (ADMIN_WEB_SECRET: mật khẩu trang web quản lý rút tiền /admin-rut-tien.html)
