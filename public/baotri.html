<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảo Trì Hệ Thống</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    text-align:center;
    max-width:500px;
    padding:30px;
}

.icon{
    font-size:90px;
    animation:spin 4s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

h1{
    margin-top:20px;
    font-size:38px;
}

p{
    margin-top:15px;
    color:#cbd5e1;
    font-size:18px;
    line-height:1.6;
}

.loader{
    width:280px;
    height:12px;
    background:#334155;
    border-radius:20px;
    margin:35px auto;
    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#22c55e,#38bdf8);
    animation:loading 3s infinite;
}

@keyframes loading{
    0%{width:0%;}
    50%{width:100%;}
    100%{width:0%;}
}

.status{
    color:#22c55e;
    font-weight:bold;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:.3;
    }
}

.footer{
    margin-top:35px;
    font-size:14px;
    color:#94a3b8;
}
</style>
</head>

<body>

<div class="container">

<div class="icon">⚙️</div>

<h1>Đang Bảo Trì</h1>

<p>
Ứng dụng đang được nâng cấp để mang đến trải nghiệm tốt hơn.<br>
Vui lòng quay lại sau nhiều phút.
</p>

<div class="loader">
<div class="progress"></div>
</div>

<div class="status">
● Hệ thống đang bảo trì...
</div>

<div class="footer">
© 2026 - Vui lòng không tắt ứng dụng nếu bạn đang chờ cập nhật.
</div>

</div>

</body>
</html>
